test_cases:

# =========================
# ANSWERABLE (10)
# =========================

- id: 1
  category: ANSWERABLE
  question: "What percentage of Earth's water is freshwater?"
  expected_answer: |
    Approximately 2.5% of Earth's total water is freshwater. Most of the remaining water is saltwater found in oceans.
  ground_truth_context:
    - "Saltwater (oceans): ~97.5%"
    - "Freshwater: ~2.5%"
  difficulty: Easy

- id: 2
  category: ANSWERABLE
  question: "How is freshwater distributed on Earth?"
  expected_answer: |
    Freshwater is mainly stored in glaciers and ice caps (~68.7%), followed by groundwater (~30.1%), and a very small portion in surface water like rivers and lakes (~1.2%).
  ground_truth_context:
    - "Glaciers and ice caps: ~68.7%"
    - "Groundwater: ~30.1%"
    - "Surface water (rivers, lakes): ~1.2%"
  difficulty: Easy

- id: 3
  category: ANSWERABLE
  question: "What are the main drivers of water scarcity?"
  expected_answer: |
    The main drivers of water scarcity include population growth, agricultural demand, industrialization, climate change, and pollution.
  ground_truth_context:
    - "Population growth"
    - "Agriculture accounts for ~70%"
    - "Industrialization"
    - "Climate change"
    - "Pollution"
  difficulty: Medium

- id: 4
  category: ANSWERABLE
  question: "Define physical water scarcity with an example"
  expected_answer: |
    Physical water scarcity occurs when natural water resources are insufficient to meet demand. It is common in arid regions such as the Middle East and North Africa.
  ground_truth_context:
    - "Occurs when natural water resources are insufficient"
    - "Common in arid regions (Middle East, North Africa)"
  difficulty: Medium

- id: 5
  category: ANSWERABLE
  question: "Define economic water scarcity with an example"
  expected_answer: |
    Economic water scarcity occurs when water exists but infrastructure or governance is inadequate. It is common in regions such as Sub-Saharan Africa.
  ground_truth_context:
    - "Occurs when water exists but infrastructure is inadequate"
    - "Common in Sub-Saharan Africa"
  difficulty: Medium

- id: 6
  category: ANSWERABLE
  question: "What are the consequences of groundwater depletion?"
  expected_answer: |
    Groundwater depletion can lead to land subsidence, reduced agricultural productivity, and saline intrusion in coastal areas.
  ground_truth_context:
    - "Land subsidence"
    - "Reduced agricultural productivity"
    - "Saline intrusion"
  difficulty: Medium

- id: 7
  category: ANSWERABLE
  question: "How does climate change affect water systems?"
  expected_answer: |
    Climate change alters precipitation patterns, increases droughts and floods, and accelerates glacier melt, affecting long-term water availability.
  ground_truth_context:
    - "Alters precipitation patterns"
    - "Droughts and floods"
    - "Glacier melt"
  difficulty: Medium

- id: 8
  category: ANSWERABLE
  question: "What are the main sources of water pollution?"
  expected_answer: |
    Major sources of water pollution include agricultural runoff, industrial effluents, and domestic sewage.
  ground_truth_context:
    - "Agricultural runoff"
    - "Industrial effluents"
    - "Domestic sewage"
  difficulty: Easy

- id: 9
  category: ANSWERABLE
  question: "What is desalination and what is its limitation?"
  expected_answer: |
    Desalination is the process of converting seawater into freshwater. Its main limitation is high energy cost.
  ground_truth_context:
    - "Converts seawater to freshwater"
    - "High energy cost"
  difficulty: Medium

- id: 10
  category: ANSWERABLE
  question: "Why is water scarcity considered a multidimensional problem?"
  expected_answer: |
    Water scarcity is multidimensional because it involves environmental, economic, and political factors, including climate change, population growth, and governance issues.
  ground_truth_context:
    - "environmental, economic, political factors"
  difficulty: Hard


# =========================
# PARTIAL (5)
# =========================

- id: 11
  category: PARTIAL
  question: "Compare physical and economic water scarcity"
  expected_answer: |
    Physical water scarcity refers to lack of water resources, while economic water scarcity refers to lack of infrastructure. Examples include the Middle East and Sub-Saharan Africa.
  ground_truth_context:
    - "Physical scarcity"
    - "Economic scarcity"
  difficulty: Hard

- id: 12
  category: PARTIAL
  question: "Why is agriculture the largest consumer of freshwater?"
  expected_answer: |
    Agriculture consumes most freshwater due to irrigation needs and inefficient methods, but detailed analysis may require additional context.
  ground_truth_context:
    - "70%"
    - "Inefficient irrigation"
  difficulty: Medium

- id: 13
  category: PARTIAL
  question: "How does groundwater depletion relate to urban demand?"
  expected_answer: |
    Groundwater depletion is influenced by urban demand and over-extraction, but full explanation requires combining multiple factors.
  ground_truth_context:
    - "Urban demand"
  difficulty: Hard

- id: 14
  category: PARTIAL
  question: "Explain the role of technology in water management"
  expected_answer: |
    Technology such as IoT and smart irrigation improves efficiency, but full solutions also require governance and policy.
  ground_truth_context:
    - "IoT"
    - "Smart irrigation"
  difficulty: Medium

- id: 15
  category: PARTIAL
  question: "Why will water scarcity affect economic development?"
  expected_answer: |
    Water scarcity impacts agriculture and industry, but full economic impact involves multiple interconnected systems.
  ground_truth_context:
    - "Agriculture"
    - "Industry"
  difficulty: Hard


